<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}VPN Store{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0f1420; --panel: #1a2130; --panel2: #232c3f;
      --accent: #6c8cff; --text: #e6ebf2; --muted: #8a94a6;
      --green: #3ecf6e; --red: #ff5c5c; --border: #2b3546;
    }
    body { margin:0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 960px; margin: 0 auto; padding: 20px; }
    .nav { display:flex; gap:14px; align-items:center; padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .nav a { color:var(--text); text-decoration:none; padding:6px 12px; border-radius:8px; }
    .nav a:hover { background:var(--panel2); }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; margin:16px 0; }
    h1,h2,h3 { margin-top:0; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
    .btn { display:inline-block; background:var(--accent); color:#fff; padding:10px 18px; border:none; border-radius:10px; cursor:pointer; text-decoration:none; font-size:15px; }
    .btn.secondary { background:var(--panel2); }
    .btn:hover { opacity:.9; }
    input, textarea, select { width:100%; padding:10px; margin:6px 0; border-radius:10px; border:1px solid var(--border); background:var(--panel2); color:var(--text); }
    .muted { color:var(--muted); font-size:13px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; background:var(--panel2); }
    .success { color:var(--green); } .error { color:var(--red); }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid var(--border); }
    .price { font-size:26px; font-weight:700; color:var(--accent); }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/store/vpn/purchase"><b>VPN Store</b></a>
    <a href="/store/vpn/purchase">Купить VPN</a>
    <a href="/store/referral">Реферальная программа</a>
    <a href="/store/tickets">Поддержка</a>
    <span style="flex:1"></span>
    {% if user %}
      <span class="muted">{{ user.username }}</span>
      <a href="/store/auth/logout">Выйти</a>
    {% else %}
      <a href="/store/auth/login">Вход</a>
      <a href="/store/auth/register">Регистрация</a>
    {% endif %}
  </div>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
