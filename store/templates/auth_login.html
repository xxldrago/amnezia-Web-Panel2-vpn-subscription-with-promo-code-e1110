{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>Вход</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if flash %}<p class="success">{{ flash }}</p>{% endif %}
  <form method="post" action="/store/auth/login">
    <label>Логин</label>
    <input name="username" required autofocus>
    <label>Пароль</label>
    <input name="password" type="password" required>
    <button class="btn" type="submit" style="width:100%;margin-top:10px">Войти</button>
  </form>
  <p style="margin-top:16px;">
    <a href="/store/auth/register">Регистрация</a> ·
    <a href="/store/auth/forgot">Забыли пароль?</a> ·
    <a href="/store/auth/tg-login">Войти через Telegram</a>
  </p>
</div>
{% endblock %}
